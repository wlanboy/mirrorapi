# Keine replicaCount: Das Deployment läuft fest mit einer Replica, siehe templates/deployment.yaml.
deploymentName: mirrorapi
namespace: mirror
image:
  repository: wlanboy/mirrorapi
  # Leer = appVersion aus Chart.yaml
  tag: ""
  pullPolicy: IfNotPresent

# Startwerte, nicht gemessen. Nach "docker stats" unter Last anpassen.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# UID/GID 1000 = appuser aus dem Dockerfile. fsGroup macht das PVC für ihn beschreibbar.
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Größe des emptyDir für /tmp
tmpSizeLimit: 64Mi

hosts: 
  - mirrorapi.tp.lan
  - mirrorapi.gmk.lan

service:
  port: 4500

persistence:
  enabled: true
  size: 100Mi
  storageClass: standard

istio:
  gateway: mirrorapi-gateway
  gatewayNamespace: "istio-ingress"

certmanager:
  enabled: true
  issuer: local-ca-issuer
  kind: ClusterIssuer
  secretName: mirrorapi-tls
