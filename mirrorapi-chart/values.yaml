replicaCount: 1
deploymentName: mirrorapi
namespace: mirror
image:
  repository: wlanboy/mirrorapi
  tag: latest
  pullPolicy: IfNotPresent

hosts: 
  - mirrorapi.tp.lan
  - mirrorapi.gmk.lan

service:
  port: 4500

persistence:
  enabled: true
  size: 100Mi
  storageClass: standard

istio:
  gateway: mirrorapi-gateway
  gatewayNamespace: "istio-ingress"

certmanager:
  issuer: local-ca-issuer
  kind: ClusterIssuer
  secretName: mirrorapi-tls
