[project]
name = "mirrorapi"
version = "0.1.0"
description = "REST-API zum Testen von HTTP-Clients: spiegelt Requests, simuliert Status-Codes und Verzögerungen, speichert Mocks"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.22.1",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "httptools>=0.9.0",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "httpx2>=2.16.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "ruff>=0.17.5",
    "watchfiles>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
